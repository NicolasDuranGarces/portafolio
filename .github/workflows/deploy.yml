name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nicolasdurangarces/portafolio
  CONTAINER_NAME: portfolio
  # Contenedor solo en loopback; el nginx del host termina TLS y proxya aqui.
  HOST_BIND: '127.0.0.1'
  HOST_PORT: '8090'
  APP_PORT: '80'
  PLATFORM: linux/amd64

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & type check
        run: |
          npx tsc --noEmit
          npx eslint src --ext .ts,.tsx

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  build-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull image and run container
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$PROD_SSH_PORT" -o BatchMode=yes \
            "$PROD_USER@$PROD_HOST" \
            "IMAGE_REF='$IMAGE_REF' \
             CONTAINER_NAME='${{ env.CONTAINER_NAME }}' \
             HOST_BIND='${{ env.HOST_BIND }}' \
             HOST_PORT='${{ env.HOST_PORT }}' \
             APP_PORT='${{ env.APP_PORT }}' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          # Imagen publica en GHCR: pull sin login. (Si se vuelve privada, agregar docker login.)
          docker pull "$IMAGE_REF"

          # Guarda la imagen del contenedor actual para rollback.
          prev_image="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"

          run_container() {
            local image="$1" name="$2"
            docker run -d \
              --name "$name" \
              --restart unless-stopped \
              --user "101:101" \
              --read-only \
              --tmpfs /var/cache/nginx:mode=1777,size=64M \
              --tmpfs /var/run:mode=1777,size=8M \
              --tmpfs /tmp:mode=1777,size=32M \
              --security-opt no-new-privileges:true \
              --cap-drop ALL \
              --cap-add NET_BIND_SERVICE \
              --memory 256m \
              --cpus 0.5 \
              -p "${HOST_BIND}:${HOST_PORT}:${APP_PORT}" \
              "$image"
          }

          wait_healthy() {
            local name="$1"
            for _ in $(seq 1 18); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || echo missing)"
              [ "$status" = healthy ] && return 0
              [ "$status" = unhealthy ] && { docker logs --tail=80 "$name"; return 1; }
              sleep 5
            done
            docker logs --tail=80 "$name"; return 1
          }

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if run_container "$IMAGE_REF" "$CONTAINER_NAME" && wait_healthy "$CONTAINER_NAME"; then
            echo "Deploy OK: $IMAGE_REF"
          else
            echo "Deploy FAILED, intentando rollback..."
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            if [ -n "$prev_image" ] && run_container "$prev_image" "$CONTAINER_NAME" && wait_healthy "$CONTAINER_NAME"; then
              echo "Rollback OK a $prev_image"
            else
              echo "Rollback fallo o sin imagen previa."
            fi
            exit 1
          fi

          docker image prune -f --filter "until=336h" >/dev/null 2>&1 || true
          REMOTE
