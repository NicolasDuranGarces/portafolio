# The container sits behind the host nginx (edge), which terminates TLS (HSTS is set at Cloudflare).
# This file only serves the prerendered static site, and it must keep working as a non root user
# on a read only filesystem: nothing here writes outside /var/cache/nginx, /var/run and /tmp.

# Vite emits content hashed files under /assets/, so those never change for a given URL.
# init.js blocks first paint and is unhashed, so it gets a short max-age instead of a revalidation on every page.
# Everything else (HTML, favicons, CV PDFs, og-image) is revalidated with its ETag.
map $uri $cache_control {
    default       "no-cache";
    ~^/assets/    "public, max-age=31536000, immutable";
    /init.js      "public, max-age=3600";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Redirect /casos/bheex to /casos/bheex/ without leaking the internal scheme or port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json application/xml text/plain;

    # add_header is only inherited when a block defines none of its own, so every header lives here
    # and no location below adds any.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Real 404 status with the branded page, never a fallback to index.html.
    # A directory without an index.html (/casos/, /assets/) is 403 in nginx: report it as 404 as well.
    error_page 403 =404 /404.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    # nginx's stock mime.types does not know .webmanifest.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }
}
