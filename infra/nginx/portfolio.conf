# Nginx global del host (edge) para 2.24.209.48
# - :80  -> ACME challenge + redirect a https para dominios del portfolio;
#           default_server preserva el comportamiento previo (proxy al geocoder movido a :8081).
# - :443 -> niduga.dev termina TLS y proxya al contenedor del portfolio (127.0.0.1:8090).
#           nicolasdurangarces.com hace 301 a https://niduga.dev (canonical del SEO).
#
# Certs en ruta estable /etc/nginx/ssl/niduga/ (self-signed al inicio;
# certbot los reemplaza vía deploy-hook, sin editar este archivo).

upstream portfolio_upstream { server 127.0.0.1:8090; }
upstream geocoder_legacy    { server 127.0.0.1:8081; }

# ---------- :80 ----------
# Default server: preserva "IP:80 / host desconocido" -> geocoder (pagina previa).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://geocoder_legacy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# :80 para los dominios del portfolio -> ACME + redirect a https.
server {
    listen 80;
    listen [::]:80;
    server_name niduga.dev www.niduga.dev nicolasdurangarces.com www.nicolasdurangarces.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://niduga.dev$request_uri; }
}

# ---------- :443 niduga.dev (sitio) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name niduga.dev www.niduga.dev;

    ssl_certificate     /etc/nginx/ssl/niduga/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/niduga/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Redirige el www al apex.
    if ($host = www.niduga.dev) { return 301 https://niduga.dev$request_uri; }

    location / {
        proxy_pass http://portfolio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- :443 nicolasdurangarces.com -> 301 a niduga.dev ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nicolasdurangarces.com www.nicolasdurangarces.com;

    ssl_certificate     /etc/nginx/ssl/niduga/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/niduga/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://niduga.dev$request_uri;
}
